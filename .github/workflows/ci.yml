name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --check portal/app.js
      - run: npm run bootstrap:kb -- --tenant ci-tenant --company "CI Export Co" --out data/ci-tenant
      - name: Docker smoke build
        run: docker build -t renwork-export-growth:ci .
