name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Test Python Scoring Engine
      run: |
        python skills/renwork-customer-asset-intelligence/scripts/scoring_engine.py

    - name: Install & Build MCP Server
      run: |
        cd mcp/export-kb-mcp
        npm ci || npm install
        npm run build

    - name: Install & Build Cloud API
      run: |
        cd cloud-api
        npm ci || npm install
        npm run build
