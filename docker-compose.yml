services:
  export-growth-api:
    build: .
    image: ghcr.io/cnproduct/renwork-export-kb-suite:latest
    ports: ["8080:8080"]
    environment:
      NODE_ENV: production
      PORT: 8080
      RENWORK_API_KEYS: "${RENWORK_API_KEYS:?Copy .env.example to .env and set a long API key}"
      RENWORK_CORS_ORIGINS: "${RENWORK_CORS_ORIGINS:-http://localhost:8080}"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
