version: '3.8'

services:
  export-kb-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renwork-export-kb-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
